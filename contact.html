<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <nav>
            <div class="logo">LM</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#timetable">Timetable</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <h1>Contact Me</h1>
    </header>

    <!-- Main Content -->
    <main>
        <section>
            <h2>Get in Touch</h2>

            <form action="#" method="post">
                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe" required minlength="2" maxlength="50">
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </p>

                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="+264 81 123 4567" required minlength="8" maxlength="15">
                </p>

                <fieldset>
                    <legend>Gender:</legend>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </fieldset>

                <p>
                    <label for="language">Favourite Programming Language:</label><br>
                    <select id="language" name="language" required>
                        <option value="" disabled selected>Select a language</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="html">HTML/CSS</option>
                    </select>
                </p>

                <fieldset>
                    <legend>Hobbies:</legend>
                    <input type="checkbox" id="gaming" name="hobbies" value="gaming">
                    <label for="gaming">Gaming</label>

                    <input type="checkbox" id="racing" name="hobbies" value="racing">
                    <label for="racing">Sim Racing</label>

                    <input type="checkbox" id="music" name="hobbies" value="music">
                    <label for="music">Music</label>
                </fieldset>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message here..." required minlength="5" maxlength="300"></textarea>
                </p>

                <p>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </p>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Lenny</p>
        <p>Student ID: 225020424</p>
        <p>Email: lynxenglish@gmail.com</p>
    </footer>

</body>
</html>
